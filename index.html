"backupFile" accept=".json,application/json" hidden>
 </section>
</main>
<footer>RESET • Progress over perfection</footer>
<div id="notice" role="status" aria-live="polite"></div>

<dialog id="profileDialog">
 <h2>👤 Your Profile</h2>
 <label for="username">Username</label>
 <input id="username" maxlength="30" placeholder="Choose a username">
 <label for="avatar">Avatar</label>
 <select id="avatar">
  <option>🌱</option><option>🔥</option><option>⚡</option>
  <option>🦁</option><option>🐺</option><option>🚀</option>
  <option>🎯</option><option>👑</option><option>💎</option>
 </select>
 <div class="actions">
  <button id="saveProfile" type="button">Save</button>
  <button id="closeProfile" class="secondary" type="button">Close</button>
 </div>
</dialog>

<dialog id="helpDialog">
 <p class="muted" id="guideCount">RESET GUIDE</p>
 <h2 id="guideTitle">Welcome to RESET!</h2>
 <p id="guideText"></p>
 <div class="actions">
  <button id="guideBack" class="secondary" type="button">Back</button>
  <button id="guideNext" type="button">Next</button>
  <button id="guideFinish" class="secondary" type="button">Finish</button>
 </div>
</dialog>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const KEY="resetV3";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const defaultHabits=["Drink water","Read or learn something","Move or stretch","Tidy my space","Limit unnecessary scrolling"];
const guide=[
["Welcome to RESET","Build better habits, complete missions, and make progress one day at a time."],
["XP and levels","Habits give 5 XP. Missions and completed focus sessions give 10 XP. Every 100 XP advances a level."],
["Habit Garden","Add habits and tick them when completed. Daily completions reset on a new day."],
["Missions","Add your tasks and tick them off when completed."],
["Focus Timer","Choose a duration, press Start, and finish the countdown to earn XP."],
["Keep going","Track your streak, challenge, and achievements. Export a backup to protect your progress."]
];
let data,seconds=1500,interval=null,running=false,guideIndex=0,noticeTimer=null;

function fresh(){return {username:"",avatar:"🌱",xp:0,streak:0,lastActive:"",habits:defaultHabits.map(name=>({id:uid(),name,done:false,doneDate:""})),missions:[],challengeDays:[],focusSessions:0,achievements:[],tutorialSeen:false};}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(data));}
 catch(e){notify("Could not save. Check browser storage settings.");}
}
function notify(message){
 const n=$("notice");n.textContent=message;n.style.display="block";
 clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>n.style.display="none",2600);
}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function load(){
 try{
  const raw=localStorage.getItem(KEY);
  data=raw?{...fresh(),...JSON.parse(raw)}:fresh();
  ["habits","missions","challengeDays","achievements"].forEach(k=>{if(!Array.isArray(data[k]))data[k]=[];});
  data.xp=Math.max(0,Number(data.xp)||0);
  data.streak=Math.max(0,Number(data.streak)||0);
  data.focusSessions=Math.max(0,Number(data.focusSessions)||0);
  data.habits.forEach(h=>{if(!h.id)h.id=uid();if(h.doneDate!==today())h.done=false;});
  data.missions.forEach(m=>{if(!m.id)m.id=uid();});
  data.habits.forEach(h=>{if(typeof h.done!=="boolean")h.done=false;});
  data.missions.forEach(m=>{if(typeof m.done!=="boolean")m.done=false;});
  save();
 }catch(e){data=fresh();save();}
}
function level(){return Math.floor(data.xp/100)+1;}
function markActive(){
 const t=today();
 if(data.lastActive!==t){
  const d=new Date();d.setDate(d.getDate()-1);
  const yesterday=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  data.streak=data.lastActive===yesterday?data.streak+1:1;
  data.lastActive=t;
 }
 if(!data.challengeDays.includes(t))data.challengeDays.push(t);
}
function award(n){data.xp=Math.max(0,data.xp+n);markActive();render();}
function checkAchievements(){
 const completedHabits=data.habits.filter(h=>h.done).length;
 const completedMissions=data.missions.filter(m=>m.done).length;
 const list=[
 ["firstHabit","🌱 First Step","Complete a habit",completedHabits>0],
 ["fiveHabits","🌿 Habit Builder","Complete five habits",completedHabits>=5],
 ["firstMission","🎯 Mission Complete","Complete a mission",completedMissions>0],
 ["hundredXP","💯 Century","Earn 100 XP",data.xp>=100],
 ["levelThree","⚡ Level Three","Reach level 3",level()>=3],
 ["firstFocus","⏱️ Focus Master","Finish a focus session",data.focusSessions>0],
 ["threeStreak","🔥 Consistency","Reach a 3-day streak",data.streak>=3],
 ["sevenDays","🏆 Seven Days","Log activity on 7 days",data.challengeDays.length>=7]
 ];
 list.forEach(a=>{if(a[3]&&!data.achievements.includes(a[0]))data.achievements.push(a[0]);});
 return list;
}
function renderStats(){
 const remaining=data.xp%100;
 $("xp").textContent=data.xp;$("level").textContent=level();$("streak").textContent=data.streak;
 $("levelLabel").textContent=remaining+" / 100 XP to level "+(level()+1);
 $("levelBar").style.width=remaining+"%";
 $("welcome").textContent=data.username?"Welcome back, "+data.username+"!":"Your next chapter starts today.";
 $("profileButton").textContent=data.avatar+" "+(data.username||"Profile");
 const quotes=["Small progress is still progress.","Build a routine you can repeat.","One good decision at a time.","Consistency matters more than perfection.","Start small. Keep going."];
 $("quote").textContent=quotes[new Date().getDate()%quotes.length];
}
function renderList(container,list,kind){
 const box=$(container);box.innerHTML="";
 if(!list.length){box.innerHTML='<p class="empty">Nothing here yet. Add one above.</p>';return;}
 list.forEach(item=>{
  const row=document.createElement("div");row.className="item";
  const points=kind==="habit"?5:10;
  row.innerHTML='<input type="checkbox" data-kind="'+kind+'" data-id="'+safe(item.id)+'" aria-label="Complete item" '+(item.done?"checked":"")+'><span class="words '+(item.done?"done":"")+'">'+safe(item.name)+'</span><span class="points">+'+points+' XP</span><button type="button" class="secondary" data-delete="'+kind+'" data-id="'+safe(item.id)+'" aria-label="Delete item">✕</button>';
  box.appendChild(row);
 });
}
function renderChallenge(){
 const box=$("challenge");box.innerHTML="";
 const now=new Date(),monday=new Date(now);monday.setHours(12,0,0,0);monday.setDate(now.getDate()-(now.getDay()+6)%7);
 let count=0;
 ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].forEach((name,i)=>{
  const d=new Date(monday);d.setDate(monday.getDate()+i);
  const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const done=data.challengeDays.includes(key);if(done)count++;
  const row=document.createElement("div");row.className="item";
  row.innerHTML="<span>"+(done?"✅":"⬜")+"</span><span class=\"words\">"+name+"</span><span class=\"points\">"+(done?"Done":"Pending")+"</span>";box.appendChild(row);
 });
 $("challengeSummary").textContent=count+" / 7 active days this week";
}
function renderAchievements(){
 const box=$("achievements");box.innerHTML="";
 checkAchievements().forEach(a=>{
  const unlocked=data.achievements.includes(a[0]),row=document.createElement("div");row.className="item";
  row.innerHTML='<span>'+(unlocked?"🏅":"🔒")+'</span><span class="words"><strong>'+safe(a[1])+'</strong><br><span class="small">'+safe(a[2])+'</span></span><span class="points">'+(unlocked?"Unlocked":"Locked")+'</span>';
  box.appendChild(row);
 });
}
function render(){
 renderStats();
 renderList("habits",data.habits,"habit");
 renderList("missions",data.missions,"mission");
 $("habitSummary").textContent=data.habits.filter(h=>h.done).length+" of "+data.habits.length+" habits completed today";
 renderChallenge();renderAchievements();save();
}
function addItem(formId,inputId,kind){
 $(formId).addEventListener("submit",e=>{
  e.preventDefault();const input=$(inputId),name=input.value.trim();
  if(!name){notify("Please type something first.");input.focus();return;}
  const item={id:uid(),name,done:false};
  if(kind==="habit"){item.doneDate="";data.habits.push(item);}else data.missions.push(item);
  input.value="";render();notify(kind==="habit"?"Habit added! 🌱":"Mission added! 🎯");input.focus();
 });
}
addItem("habitForm","habitInput","habit");
addItem("missionForm","missionInput","mission");

document.addEventListener("change",e=>{
 const el=e.target;if(!el.matches("input[data-kind]"))return;
 const habit=el.dataset.kind==="habit",list=habit?data.habits:data.missions,item=list.find(x=>x.id===el.dataset.id);
 if(!item||item.done===el.checked)return;
 item.done=el.checked;
 if(habit)item.doneDate=el.checked?today():"";
 if(el.checked){data.xp+=habit?5:10;markActive();notify(habit?"+5 XP! 🌱":"+10 XP! 🎯");}
 else{data.xp=Math.max(0,data.xp-(habit?5:10));notify("Completion undone.");}
 render();
});
document.addEventListener("click",e=>{
 const btn=e.target.closest("button[data-delete]");if(!btn)return;
 if(!confirm("Delete this item?"))return;
 const habit=btn.dataset.delete==="habit";
 if(habit)data.habits=data.habits.filter(x=>x.id!==btn.dataset.id);
 else data.missions=data.missions.filter(x=>x.id!==btn.dataset.id);
 render();notify("Item deleted.");
});

// Profile
$("profileButton").addEventListener("click",()=>{
 $("username").value=data.username;$("avatar").value=data.avatar;
 $("profileDialog").showModal();
});
$("closeProfile").addEventListener("click",()=>$("profileDialog").close());
$("saveProfile").addEventListener("click",()=>{
 data.username=$("username").value.trim().slice(0,30);data.avatar=$("avatar").value;
 render();$("profileDialog").close();notify("Profile saved!");
});

// Timer: uses timestamps to reduce timing drift.
function stopTimer(){if(interval!==null)clearInterval(interval);interval=null;running=false;}
function paintClock(){seconds=Math.max(0,seconds);$("clock").textContent=String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");}
function resetTimer(){
 stopTimer();seconds=Number($("minutes").value)*60;paintClock();
 $("timerMessage").textContent="Ready when you are.";$("startTimer").disabled=false;
}
function finishTimer(){
 stopTimer();seconds=0;paintClock();$("startTimer").disabled=false;
 $("timerMessage").textContent="Session complete. Great work!";
 data.focusSessions++;data.xp+=10;markActive();render();notify("Focus session complete! +10 XP 🎉");
 if(navigator.vibrate)navigator.vibrate(150);
}
$("minutes").addEventListener("change",resetTimer);
$("startTimer").addEventListener("click",()=>{
 if(running)return;
 if(seconds<=0)resetTimer();
 running=true;$("startTimer").disabled=true;
 $("timerMessage").textContent="Focus on one thing at a time.";
 const end=Date.now()+seconds*1000;
 interval=setInterval(()=>{
  seconds=Math.ceil((end-Date.now())/1000);paintClock();
  if(seconds<=0)finishTimer();
 },250);
});
$("pauseTimer").addEventListener("click",()=>{
 if(!running){notify("Timer is already paused.");return;}
 seconds=Math.max(0,seconds);stopTimer();paintClock();$("startTimer").disabled=false;
 $("timerMessage").textContent="Paused. Tap Start to resume.";
});
$("resetTimer").addEventListener("click",resetTimer);

// Tutorial
function paintGuide(){
 const g=guide[guideIndex];
 $("guideCount").textContent="RESET GUIDE • "+(guideIndex+1)+"/"+guide.length;
 $("guideTitle").textContent=g[0];$("guideText").textContent=g[1];
 $("guideBack").disabled=guideIndex===0;
 $("guideNext").textContent=guideIndex===guide.length-1?"Finish":"Next";
}
function showGuide(){guideIndex=0;paintGuide();$("helpDialog").showModal();}
function finishGuide(){data.tutorialSeen=true;save();$("helpDialog").close();}
$("helpButton").addEventListener("click",showGuide);
$("guideBack").addEventListener("click",()=>{if(guideIndex>0){guideIndex--;paintGuide();}});
$("guideNext").addEventListener("click",()=>{if(guideIndex<guide.length-1){guideIndex++;paintGuide();}else finishGuide();});
$("guideFinish").addEventListener("click",finishGuide);

// Export and import backups
$("exportButton").addEventListener("click",()=>{
 try{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="RESET-backup-"+today()+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  notify("Backup exported!");
 }catch(e){notify("Export failed. Please try again.");}
});
$("importButton").addEventListener("click",()=>$("backupFile").click());
$("backupFile").addEventListener("change",async e=>{
 const file=e.target.files[0];if(!file)return;
 try{
  const imported=JSON.parse(await file.text());
  if(!imported||typeof imported!=="object"||!Array.isArray(imported.habits)||!Array.isArray(imported.missions)||!Number.isFinite(Number(imported.xp))||Number(imported.xp)<0)throw Error("Invalid backup");
  if(!confirm("Import this backup? Your current progress will be replaced."))return;
  const base=fresh();
  data={...base,...imported};
  ["habits","missions","challengeDays","achievements"].forEach(k=>{if(!Array.isArray(data[k]))data[k]=[];});
  data.habits.forEach(h=>{if(!h.id)h.id=uid();if(h.doneDate!==today())h.done=false;});
  data.missions.forEach(m=>{if(!m.id)m.id=uid();});
  data.xp=Math.max(0,Number(data.xp)||0);
  render();resetTimer();notify("Backup imported successfully!");
 }catch(err){notify("That backup file is invalid.");}
 finally{e.target.value="";}
});

// Clear all progress only after confirmation
$("clearButton").addEventListener("click",()=>{
 if(!confirm("Reset ALL RESET data? This cannot be undone unless you have a backup."))return;
 stopTimer();data=fresh();render();resetTimer();notify("All data has been reset.");
});

// Start app
load();render();resetTimer();
if(!data.tutorialSeen){showGuide();}
})();
</script>
</body>
</html>
